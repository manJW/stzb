<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>率土 · 同盟考勤</title><link rel="stylesheet" href="/attendance.css"><link rel="stylesheet" href="/role-context.css"></head>
<body><header class="site-header"><a href="/battlefield" class="brand">率土战场</a><nav aria-label="主导航"><a href="/battlefield">实时地图</a><a href="/">情报看板</a><a href="/archive">赛季档案</a><a href="/attendance" aria-current="page">同盟考勤</a></nav></header>
<main><div class="heading"><div><div class="eyebrow">同盟管理</div><h1>同盟考勤</h1><p id="identity">正在读取当前角色…</p></div><div class="actions"><button id="rulesOpen">积分规则</button><button id="export">导出表格</button></div></div>
<form id="filters"><label>开始日期<input id="from" type="date" required></label><label>结束日期<input id="to" type="date" required></label><label>分组<select id="group"><option value="">全部分组</option></select></label><label class="search">玩家<input id="search" type="search" placeholder="搜索玩家名" maxlength="60"></label><button class="primary">查询</button><button id="yesterday" type="button">昨天</button><button id="today" type="button">今天</button></form>
<div class="summary"><span id="summary">正在统计…</span><div class="connection"><span id="connectionStatus" data-live="false">正在连接</span><span id="updated" role="status"></span></div></div>
<div class="table-wrap"><table><thead><tr id="attendanceHeaders"></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>暂无可核对的参战记录</div></div>
<p class="footnote">胜率与交换比仅统计双方主力交战；NPC作战、翻地和被翻单独记账。翻地需要成功占领与原归属证据，打赢守军不直接算翻地。缺少来源的指标显示“—”，不计为0；积分权重未设置时不排名。统计仅覆盖已收到或已观测资料。</p><p id="retention" class="footnote"></p>
</main>
<dialog id="rulesDialog"><form id="rulesForm"><div class="dialog-heading"><h2>积分规则</h2><button type="button" id="rulesClose" aria-label="关闭">×</button></div><p>积分 = 各项统计 × 对应权重。规则只用于当前角色、本盟，不影响原始记录。</p><label class="switch"><input type="checkbox" id="enabled">启用积分</label><div id="weights"></div><p class="footnote">权重支持小数和负数。缺少所需数据时，积分留空。</p><div class="dialog-actions"><span id="ruleError" role="alert"></span><button class="primary">保存规则</button></div></form></dialog>
<dialog id="detailDialog"><div class="dialog-heading"><h2 id="detailTitle">参战明细</h2><button id="detailClose" aria-label="关闭">×</button></div><p id="detailStatus"></p><div class="table-wrap"><table><thead><tr><th>时间</th><th>战报</th><th>坐标</th><th>出战方</th><th>类型</th><th>结果</th><th>武勋</th></tr></thead><tbody id="detailRows"></tbody></table></div></dialog>
<script src="/attendance.js"></script><script src="/role-context.js"></script></body></html>

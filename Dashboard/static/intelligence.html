<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>率土 · 赛季档案</title>
  <link rel="stylesheet" href="/intelligence.css">
  <link rel="stylesheet" href="/role-context.css">
  <link rel="stylesheet" href="/harvest.css">
  <link rel="stylesheet" href="/formations.css">
</head>
<body class="archive-page">
  <header class="site-header">
    <div class="shell header-inner">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true">土</span><span>率土战场</span></a>
      <nav class="site-links" aria-label="主导航">
        <a href="/">情报看板</a>
        <a href="/battlefield">实时地图</a>
        <a href="/archive" aria-current="page">赛季档案</a>
        <a href="/attendance">同盟考勤</a>
      </nav>
      <div class="session-info"><span id="archiveStatus" class="connection-label">连接中</span></div>
    </div>
  </header>
  <main class="shell archive-main">
    <header class="archive-heading">
      <div><h1>赛季档案</h1><p id="profileLabel">正在读取档案…</p><a id="openArchiveReference" href="#archiveReference">查看分类档案 ↓</a></div>
      <dl class="archive-stats" aria-label="本赛季已归档">
        <div><dt>行军记录</dt><dd id="marchesCount">—</dd></div>
        <div><dt>战报索引</dt><dd id="reportsCount">—</dd></div>
        <div><dt>战报全文</dt><dd id="fullReportsCount">—</dd></div>
      </dl>
    </header>

    <div id="formationArchive"></div>
    <section class="archive-workspace" aria-labelledby="timelineTitle" hidden>
      <header class="archive-section-head"><h2 id="timelineTitle">玩家与队伍</h2><p>展开玩家看队伍，展开队伍看行军、换阵和战报。</p></header>
      <form id="timelineFilters" class="archive-filters">
        <label>玩家<input id="timelinePlayer" name="player" placeholder="输入玩家名" maxlength="60" autocomplete="off"></label>
        <label>队伍<select id="timelineArmy" name="army_id"><option value="">全部队伍</option></select></label>
        <label>坐标<input id="timelineCoord" name="coord" placeholder="如 1015,926" maxlength="16" autocomplete="off"></label>
        <label>开始时间<input id="timelineFrom" name="from_at" type="datetime-local"></label>
        <label>结束时间<input id="timelineTo" name="to_at" type="datetime-local"></label>
        <div class="archive-filter-actions"><button class="primary" type="submit">查询</button><button id="timelineClear" type="button">重置</button></div>
      </form>
      <div class="archive-results-meta"><span id="timelineStatus" role="status">正在读取记录…</span><span>时间按北京时间显示</span></div>
      <div class="archive-player-labels" aria-hidden="true"><span>玩家 / 同盟</span><span>已建档队伍</span><span>最近记录</span></div>
      <div id="timelineResults" class="archive-results" aria-label="玩家与队伍查询结果"></div>
      <nav class="archive-pages" aria-label="玩家分页"><button id="timelinePrevious" type="button" disabled>上一页</button><span id="timelinePage">第 1 页</span><button id="timelineNext" type="button" disabled>下一页</button></nav>
    </section>

    <details id="archiveReference" class="archive-secondary">
    <summary>其他档案与原始记录</summary>
    <section class="records" aria-labelledby="archiveTitle">
      <div class="records-heading"><h2 id="archiveTitle">分类档案</h2><button id="profileButton" type="button">档案设置</button></div>
      <nav id="archiveViews" class="record-tabs" aria-label="档案分类">
        <button type="button" data-kind="players" aria-pressed="false">同盟成员</button>
        <button type="button" data-kind="marches" aria-pressed="false">行军与速度</button>
        <button type="button" data-kind="battles" class="active" aria-pressed="true">战报索引</button>
        <button type="button" data-kind="events" aria-pressed="false">战场历史</button>
        <button type="button" data-kind="definitions" aria-pressed="false">字段管理</button>
      </nav>
      <div class="toolbar">
        <label>同盟<select id="unionFilter" aria-label="筛选同盟"><option value="">全部已观测同盟</option></select></label>
        <label class="search">搜索<input id="archiveSearch" type="search" placeholder="玩家、武将或战法" aria-label="搜索情报"></label>
        <button id="refreshButton" type="button">刷新</button><button id="exportButton" type="button">导出本页</button>
        <span id="pageInfo"></span>
        <button id="previousPage" type="button" aria-label="上一页">←</button><button id="nextPage" type="button" aria-label="下一页">→</button>
      </div>
      <p id="tabHelp" class="help"></p>
      <div id="dataTable" class="table-container" aria-live="polite" role="region" aria-label="档案结果" tabindex="0"></div>
    </section>
    </details>

    <details class="data-controls">
      <summary>历史战报采集</summary>
      <div class="data-control-body">
        <p id="reportLoading">正在读取历史采集进度…</p>
        <p id="coverage"></p>
        <div class="harvest" aria-label="历史战报采集控制">
          <div><span id="harvestStatus" role="status">正在读取状态…</span><small id="harvestProgress"></small></div>
          <label>最多<input id="harvestPages" type="number" min="1" max="1000" value="100" aria-label="本轮最多读取页数">页</label>
          <button id="harvestStart" type="button">从最新开始</button>
          <button id="harvestResume" type="button" disabled>断点续采</button>
          <button id="harvestPause" type="button" disabled>暂停</button>
        </div>
      </div>
    </details>
  </main>
  <footer class="shell"><span id="storagePath"></span><span id="updateTime"></span></footer>
  <dialog id="timelineDialog" class="timeline-dialog" aria-labelledby="timelineDetailTitle">
    <div class="dialog-heading"><div><p class="archive-detail-kicker" id="timelineDetailMeta"></p><h2 id="timelineDetailTitle">队伍记录</h2></div><button id="timelineClose" type="button" aria-label="关闭链路详情">×</button></div>
    <div id="timelineDetail" class="archive-detail" aria-live="polite"></div>
  </dialog>
  <dialog id="teamDialog" aria-labelledby="teamTitle">
    <div class="dialog-heading"><h2 id="teamTitle">队伍记录</h2><button id="closeTeam" aria-label="关闭队伍详情">×</button></div>
    <div id="teamBody"></div>
  </dialog>
  <dialog id="profileDialog" aria-labelledby="profileTitle">
    <div class="dialog-heading"><h2 id="profileTitle">账号与赛季档案</h2><button id="closeProfile" aria-label="关闭档案设置">×</button></div>
    <form id="profileForm">
      <p class="help">当前采集已绑定此角色、本盟和赛季，可修改显示名称。更换绑定前需停止采集并核对新游戏环境。</p>
      <label>区服<input name="server" readonly required></label>
      <label>赛季分档标识<input name="season" readonly required></label>
      <label>赛季显示名称<input name="season_label" required></label>
      <label>角色档案编号<input name="account_role_id" readonly required></label>
      <label>角色名<input name="account_name" required></label>
      <label>本盟编号<input name="union_id" readonly required></label>
      <label>本盟名称<input name="union_name" required></label>
      <button type="submit" class="primary">保存档案名称</button>
      <p id="profileResult"></p>
    </form>
  </dialog>
  <script src="/intelligence.js"></script>
  <script src="/formations.js"></script>
<script src="/role-context.js"></script></body>
</html>
